plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.wavetune'
version = '1.0.0'

android {
  namespace "com.wavetune.audioroute"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.github.Adonai:jaudiotagger:2.3.13'
}
